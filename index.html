<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="copyright" content="© Hazem Ahmed 2026 — جميع الحقوق محفوظة">
<meta name="author" content="حازم أحمد">
<title>دلع طيرك — اعرف طيرك… واهتم بيه صح | © حازم أحمد 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3E8; --surface:#FFFDF7; --card:#FFFFFF; --ink:#26331F; --muted:#66755B;
  --line:#E4DBC4; --green:#2F5D3A; --green-2:#3E7C4F; --accent:#E8833A; --amber:#DB9A2E;
  --red:#B6482F; --shadow:0 10px 30px rgba(60,70,40,.10);
}
[data-theme="dark"]{
  --bg:#131A14; --surface:#1A231B; --card:#1F2A20; --ink:#EDE7D4; --muted:#9DAA8F;
  --line:#2B382C; --green:#7FBF8E; --green-2:#5E9E6E; --accent:#F09A50; --amber:#E0AC4C;
  --red:#D06A50; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif;line-height:1.35}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
.sec{padding-block:34px}
.ic{vertical-align:-3px}
::selection{background:var(--accent);color:#fff}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:60;border-bottom:1px solid var(--line);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px)}
.hd{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:1.35rem;color:var(--green)}
.brand .logo-b{width:40px;height:34px;overflow:visible}
nav.main{display:flex;gap:4px;margin-inline-start:12px}
nav.main a{padding:7px 14px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--muted);transition:.2s}
nav.main a:hover{color:var(--ink);background:var(--card)}
nav.main a.on{color:#fff;background:var(--green-2)}
.hd-tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.tbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.2s}
.tbtn:hover{transform:translateY(-2px);border-color:var(--green-2)}
#menuBtn{display:none}
#mobileNav{display:none;flex-direction:column;gap:2px;padding:8px 20px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
#mobileNav a{padding:10px 12px;border-radius:12px;font-weight:600}
#mobileNav a.on{background:var(--green-2);color:#fff}
@media(max-width:820px){nav.main{display:none}#menuBtn{display:grid}}

/* ===== Animations ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes flap{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-13deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.stagger>*{animation:rise .55s cubic-bezier(.22,.7,.3,1) both}
.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.14s}
.stagger>*:nth-child(4){animation-delay:.21s}.stagger>*:nth-child(5){animation-delay:.28s}
.stagger>*:nth-child(6){animation-delay:.35s}.stagger>*:nth-child(7){animation-delay:.42s}
.stagger>*:nth-child(8){animation-delay:.49s}.stagger>*:nth-child(9){animation-delay:.56s}
.stagger>*:nth-child(10){animation-delay:.63s}
.anim{animation:rise .6s cubic-bezier(.22,.7,.3,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Hero ===== */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding-block:56px 40px;min-height:430px}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.85rem;font-weight:600;color:var(--green-2)}
.hero h1{font-size:clamp(2.6rem,6vw,4.3rem);font-weight:800;color:var(--green);margin:16px 0 4px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1 .logo-b{width:clamp(70px,9vw,105px);overflow:visible;flex:none}
.tagline{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:600;font-family:'Baloo Bhaijaan 2';color:var(--accent);display:flex;align-items:center;gap:9px}
.hero p.sub{color:var(--muted);max-width:46ch;margin-top:12px}
.hero-cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.hero-art{justify-self:center;text-align:center}
.hero-art svg{width:min(340px,80vw);overflow:visible;animation:bob 4.5s ease-in-out infinite}
.hero-art .leaf{transform-box:fill-box;transform-origin:20% 20%;animation:sway 5s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--green-2);color:#fff;font-weight:700;padding:12px 24px;border-radius:14px;font-size:1rem;transition:.2s;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-3px);background:var(--green)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--green-2)}
.btn.warn{background:var(--amber)}
.btn.warn:hover{background:var(--red)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-block:34px 24px;text-align:center}
.hero h1{justify-content:center}.tagline{justify-content:center}.hero-cta,.hero p.sub{justify-content:center;margin-inline:auto}}

/* ===== Duo cards ===== */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.duo-card{display:flex;align-items:center;gap:22px;text-align:start;padding:26px;border-radius:24px;transition:.25s;border:1px solid var(--line);box-shadow:var(--shadow)}
.duo-card:hover{transform:translateY(-5px)}
.duo-card .arts{flex:none;width:132px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.duo-card .arts svg{width:100%;overflow:visible}
.duo-card h2{font-size:1.6rem;margin-bottom:2px}
.duo-card p{font-size:.92rem;opacity:.85}
.duo-card .go{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-weight:700;font-size:.9rem}
.duo-card:hover .go svg{transform:translateX(-5px)}
.duo-card .go svg{transition:.25s}
.duo.pets-c{background:color-mix(in srgb,#EAF2DF 62%,var(--card));color:var(--ink)}
.duo.pets-c .go{color:var(--green-2)}
.duo.rap-c{background:#22301F;color:#F2EDDD;border-color:#31452C}
[data-theme="dark"] .duo.rap-c{background:#1B2618}
.duo.rap-c .go{color:#E8B45A}
@media(max-width:720px){.duo{grid-template-columns:1fr}.duo-card{padding:20px}.duo-card .arts{width:100px}}

/* ===== How it works ===== */
.how h2{text-align:center;font-size:1.7rem;color:var(--green)}
.steps3{list-style:none;display:flex;justify-content:center;gap:0;margin-top:34px;counter-reset:s}
.steps3 li{position:relative;flex:1;max-width:300px;padding:0 18px;text-align:center}
.steps3 li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:var(--card);border:2px solid var(--green-2);color:var(--green-2);font-family:'Baloo Bhaijaan 2';font-weight:800;font-size:1.5rem;position:relative;z-index:1}
.steps3 li:not(:last-child)::after{content:"";position:absolute;top:29px;left:-50%;width:100%;border-top:2px dashed var(--line);z-index:0}
.steps3 b{display:block;font-family:'Baloo Bhaijaan 2';font-size:1.05rem}
.steps3 span{font-size:.87rem;color:var(--muted)}
@media(max-width:640px){.steps3{flex-direction:column;gap:22px;align-items:center}.steps3 li::after{display:none}}
.notice{margin-top:44px;display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;background:color-mix(in srgb,var(--amber) 12%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line))}
.notice b{color:var(--amber)}
.notice .btn{margin-inline-start:auto;flex:none}
@media(max-width:640px){.notice{flex-direction:column;text-align:center}.notice .btn{margin:0}}

/* ===== Category page ===== */
.page-head{display:flex;align-items:end;gap:16px;flex-wrap:wrap;padding-block:38px 8px}
.page-head h1{font-size:clamp(1.9rem,4vw,2.6rem);color:var(--green)}
.page-head p{color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:250px;flex:1;max-width:340px;margin-inline-start:auto}
.searchbar input{border:none;outline:none;background:none;font-family:inherit;font-size:.95rem;color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;padding-block:20px 50px}
.bcard{position:relative;text-align:start;border-radius:22px;border:1px solid var(--line);border-block-end:6px solid var(--a);padding:20px;display:flex;flex-direction:column;gap:6px;transition:.25s;background:var(--card)}
@supports(color:color-mix(in srgb,red,blue)){.bcard{background:color-mix(in srgb,var(--b) 38%,var(--card))}}
.bcard:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.bcard.pop{grid-column:span 2}
.bcard.pop .bwrap{flex-direction:row;align-items:center}
.bwrap{display:flex;flex-direction:column;gap:12px;flex:1}
.bmedal{width:110px;height:96px;border-radius:18px;background:color-mix(in srgb,var(--b) 55%,#fff);display:grid;place-items:center;overflow:hidden}
[data-theme="dark"] .bmedal{background:color-mix(in srgb,var(--b) 20%,#141a15)}
.bmedal svg{width:96px;overflow:visible}
.bcard h3{font-size:1.3rem;display:flex;align-items:center;gap:8px}
.bcard h3 .my{color:var(--amber);display:inline-grid}
.bcard p{font-size:.85rem;color:var(--muted);flex:1}
.bcard .opn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;color:var(--a)}
.bcard:hover .opn svg{transform:translateX(-4px)}
.bcard .opn svg{transition:.25s}
.bcard.soon{border-style:dashed;border-block-end-width:1px;background:var(--card);align-items:center;justify-content:center;color:var(--muted)}
.bcard.soon:hover{transform:none;box-shadow:none}
@media(max-width:560px){.bcard.pop{grid-column:span 1}}

/* ===== Bird page ===== */
.raptor-banner{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-radius:16px;background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));margin-block:26px 0;color:var(--ink)}
.raptor-banner svg{flex:none;color:var(--red);margin-top:3px}
.bird-hero{margin-top:26px;border-radius:28px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:color-mix(in srgb,var(--b) 30%,var(--card));border:1px solid var(--line);position:relative;overflow:hidden}
.bird-hero .deco{position:absolute;inset-inline-start:-40px;bottom:-60px;width:190px;opacity:.12;transform:rotate(12deg)}
.bird-hero .info{position:relative;z-index:1}
.cat-chip{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--a) 16%,var(--card));color:var(--a);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);padding:5px 14px;border-radius:999px;font-size:.8rem;font-weight:700}
.bird-hero h1{font-size:clamp(2rem,4.5vw,3rem);color:var(--green);margin:10px 0 6px}
.bird-hero .desc{max-width:56ch;color:var(--muted)}
.bird-hero .arts{position:relative;z-index:1;width:min(240px,60vw)}
.bird-hero .arts svg{width:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(0,0,0,.12))}
.mybtn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 18px;border-radius:12px;border:1.5px solid var(--amber);color:var(--amber);font-weight:700;background:transparent;transition:.2s}
.mybtn.on{background:var(--amber);color:#fff}
.backrow{display:flex;align-items:center;gap:10px;margin-top:22px}
.backbtn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;padding:8px 14px;border-radius:12px;transition:.2s}
.backbtn:hover{color:var(--ink);background:var(--card)}
@media(max-width:720px){.bird-hero{grid-template-columns:1fr;text-align:center;padding:24px}.bird-hero .arts{margin:0 auto}.bird-hero h1{justify-content:center}.bird-hero .desc{margin-inline:auto}}

/* ===== Quiz ===== */
.quiz{margin-top:22px;border-radius:22px;border:1px solid var(--line);background:var(--card);padding:24px}
.quiz h2{font-size:1.35rem;color:var(--green);display:flex;align-items:center;gap:10px}
.quiz .hint{color:var(--muted);font-size:.88rem;margin-top:2px}
.qrow{margin-top:16px}
.qrow label{font-weight:700;font-size:.92rem;display:block;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--green-2)}
.chip.sel{background:var(--green-2);border-color:var(--green-2);color:#fff}
.qout{margin-top:18px;border-radius:16px;padding:16px 18px;border-inline-start:5px solid var(--muted);background:var(--surface);animation:rise .4s both}
.qout.good{border-color:#5FA36B}.qout.warn{border-color:var(--red)}.qout.info{border-color:var(--amber)}
.qout b{font-size:1.05rem}
.qout.good b{color:#4E9159}.qout.warn b{color:var(--red)}.qout.info b{color:var(--amber)}
.vet-note{margin-top:14px;display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--amber) 10%,var(--surface));border:1px dashed color-mix(in srgb,var(--amber) 50%,var(--line));padding:12px 14px;border-radius:12px}
.vet-note svg{flex:none;color:var(--amber);margin-top:3px}

/* ===== Tabs ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:26px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;color:var(--muted);transition:.2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--green-2);border-color:var(--green-2);color:#fff}
.tabbody{padding-bottom:60px;animation:rise .4s both}
.tabbody h3.sect{font-size:1.15rem;color:var(--green);margin:26px 0 10px;display:flex;align-items:center;gap:9px}
.tabbody h3.sect:first-child{margin-top:0}
.lead{color:var(--muted);max-width:70ch}
ul.pts{list-style:none;margin-top:10px;display:grid;gap:9px}
ul.pts li{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.93rem}
ul.pts li svg{flex:none;color:var(--green-2);margin-top:4px}
ul.pts li.bad svg{color:var(--red)}
ul.pts li b.t{display:block}
ul.pts li span.d{color:var(--muted);font-size:.88rem}
.warnbox{margin-top:20px;border-radius:16px;background:color-mix(in srgb,var(--red) 8%,var(--card));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));padding:18px 20px}
.warnbox h4{display:flex;align-items:center;gap:9px;color:var(--red);font-family:'Baloo Bhaijaan 2';font-size:1.05rem;margin-bottom:8px}
.warnbox ul{list-style:none;display:grid;gap:8px}
.warnbox li{display:flex;gap:9px;font-size:.9rem}
.warnbox li svg{flex:none;color:var(--red);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:680px){.two{grid-template-columns:1fr}}
.sign-col{border-radius:16px;border:1px solid var(--line);padding:16px 18px;background:var(--card)}
.sign-col h4{font-size:1rem;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.sign-col.chick h4{color:var(--amber)}.sign-col.weaned h4{color:var(--green-2)}
.sign-col ul{list-style:none;display:grid;gap:8px}
.sign-col li{display:flex;gap:9px;font-size:.88rem;color:var(--muted)}
.sign-col li svg{flex:none;margin-top:4px}
.stagerow{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-top:9px}
.stagerow .st{flex:none;font-weight:800;font-family:'Baloo Bhaijaan 2';font-size:.85rem;padding:4px 13px;border-radius:999px;color:#fff}
.stagerow p{font-size:.9rem;color:var(--muted)}

/* Taming steps */
.prog{margin:14px 0 6px}
.prog .bar{height:10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog .fill{height:100%;background:var(--green-2);border-radius:99px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.prog .lbl{font-size:.82rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.steps-list{list-style:none;margin-top:12px;display:grid;gap:10px;counter-reset:st}
.steps-list li{counter-increment:st;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.2s;user-select:none}
.steps-list li:hover{border-color:var(--green-2)}
.steps-list li::before{content:counter(st);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:'Baloo Bhaijaan 2';font-weight:800;transition:.2s}
.steps-list li.done{border-color:var(--green-2);background:color-mix(in srgb,var(--green-2) 8%,var(--card))}
.steps-list li.done::before{content:"✓";background:var(--green-2);border-color:var(--green-2);color:#fff;animation:pop .35s both}
.steps-list li.done .stx{opacity:.55;text-decoration:line-through;text-decoration-color:var(--green-2);text-decoration-thickness:2px}
.steps-list .stx{flex:1;font-size:.93rem;padding-top:3px}
.reset-steps{margin-top:12px;font-size:.83rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.reset-steps:hover{color:var(--red)}

/* Behavior */
.sig{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:10px}
.sig .ic-w{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.sig.good .ic-w{background:color-mix(in srgb,#5FA36B 16%,transparent);color:#4E9159}
.sig.warn .ic-w{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.sig.info .ic-w{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.sig b{display:block}
.sig span{color:var(--muted);font-size:.88rem}

/* Training timeline */
.timeline{list-style:none;margin-top:14px;position:relative;display:grid;gap:0}
.timeline::before{content:"";position:absolute;top:10px;bottom:10px;inset-inline-start:19px;border-inline-start:2px dashed var(--line)}
.timeline li{position:relative;padding:0 0 22px 0;padding-inline-start:58px}
.timeline li:last-child{padding-bottom:0}
.timeline .num{position:absolute;inset-inline-start:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--green-2);color:var(--green-2);display:grid;place-items:center;font-family:'Baloo Bhaijaan 2';font-weight:800}
.timeline b{display:block;font-family:'Baloo Bhaijaan 2';font-size:1.02rem}
.timeline span{font-size:.9rem;color:var(--muted)}
.switcher{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:20px;border-top:1px dashed var(--line)}
.switcher .chip.sel{background:var(--green-2);color:#fff;border-color:var(--green-2)}

/* ===== Assistant ===== */
#fab{position:fixed;bottom:22px;inset-inline-start:22px;z-index:80;width:64px;height:64px;border-radius:50%;background:var(--card);border:2px solid var(--green-2);box-shadow:var(--shadow);display:grid;place-items:center;transition:.25s}
#fab:hover{transform:translateY(-4px) scale(1.05)}
#fab svg{width:46px;overflow:visible}
#fab .dot{position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
#asst{position:fixed;bottom:0;inset-inline-start:0;z-index:90;width:min(400px,100vw);height:min(600px,88vh);background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateY(110%);transition:transform .4s cubic-bezier(.25,.9,.3,1)}
#asst.open{transform:none}
.asst-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.asst-hd .av{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,#F5CE4A 30%,var(--card));display:grid;place-items:center;overflow:hidden}
.asst-hd .av svg{width:38px;overflow:visible}
.asst-hd b{font-family:'Baloo Bhaijaan 2';font-size:1.05rem;display:block}
.asst-hd small{color:var(--muted);display:flex;align-items:center;gap:5px;font-size:.75rem}
.asst-hd small::before{content:"";width:8px;height:8px;border-radius:50%;background:#5FA36B}
.asst-hd .tools{margin-inline-start:auto;display:flex;gap:4px}
.asst-hd .tools button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.asst-hd .tools button:hover{background:var(--card);color:var(--ink)}
#asstMsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;font-size:.9rem;animation:rise .3s both;white-space:normal}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:4px}
.msg.me{align-self:flex-end;background:var(--green-2);color:#fff;border-start-end-radius:4px}
.msg.typing{display:flex;gap:5px;padding:14px 18px}
.msg.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.msg.typing span:nth-child(2){animation-delay:.18s}.msg.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#asstChips{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px}
#asstChips:empty{display:none}
#asstChips .chip{font-size:.82rem;padding:7px 13px}
.asst-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.asst-form input{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:11px 15px;font-family:inherit;font-size:.9rem;color:var(--ink);outline:none}
.asst-form input:focus{border-color:var(--green-2)}
.asst-form button{width:46px;border-radius:13px;background:var(--green-2);color:#fff;display:grid;place-items:center;transition:.2s}
.asst-form button:hover{background:var(--green)}
.msg .btn{padding:8px 16px;font-size:.83rem;margin-top:10px;margin-inline-end:6px}

/* ===== Search overlay ===== */
#searchOv{position:fixed;inset:0;z-index:100;background:rgba(20,25,15,.45);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:90px 20px 20px}
#searchOv.open{display:flex}
.search-panel{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:rise .3s both}
.search-panel .searchbar{margin:0;max-width:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 20px}
#searchRes{max-height:50vh;overflow-y:auto;padding:8px}
.sres{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:10px 14px;border-radius:14px;transition:.15s}
.sres:hover{background:var(--card)}
.sres svg{width:52px;overflow:visible;flex:none}
.sres b{font-family:'Baloo Bhaijaan 2';display:block}
.sres small{color:var(--muted);font-size:.78rem}
.sres .cat-tag{margin-inline-start:auto;font-size:.72rem;font-weight:700;color:var(--green-2);background:color-mix(in srgb,var(--green-2) 12%,transparent);padding:3px 11px;border-radius:99px}
.sres .cat-tag.r{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.snone{padding:26px;text-align:center;color:var(--muted);font-size:.9rem}

/* ===== Toast / footer ===== */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);animation:rise .3s both;display:flex;gap:9px;align-items:center}
footer{border-top:1px solid var(--line);padding:26px 20px 90px;text-align:center;color:var(--muted);font-size:.83rem}
footer b{font-family:'Baloo Bhaijaan 2';color:var(--green)}
footer .copy{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:.82rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
footer .copy .c-sym{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;
  background:var(--green-2);color:#fff;font-size:.72rem;font-weight:700}
footer .copy b{color:var(--accent)}
</style>
</head>

/* ---------- 2) رسومات الطيور SVG ---------- */
function sideBird(a){
  const tails={long:'M86,84 L14,58 6,82 22,110 86,116',med:'M86,86 L34,68 26,90 38,110 86,112',short:'M86,88 L52,74 46,92 56,108 86,110'};
  let s=`<svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${a.alt||'طائر'}">`;
  s+=`<path d="${tails[a.tail||'med']}Z" fill="${a.tailC||a.wing}"/>`;
  s+=`<ellipse cx="122" cy="100" rx="58" ry="46" fill="${a.body}"/>`;
  s+=`<ellipse cx="140" cy="118" rx="33" ry="25" fill="${a.belly}"/>`;
  if(a.speckles){s+=`<g fill="${a.speckles}" opacity=".55"><circle cx="132" cy="110" r="2.4"/><circle cx="146" cy="120" r="2.4"/><circle cx="136" cy="128" r="2.4"/><circle cx="150" cy="108" r="2.4"/><circle cx="126" cy="122" r="2.4"/></g>`;}
  s+=`<g transform="rotate(-16 104 92)">${a.flap?'<g class="flap-w">':''}<ellipse cx="104" cy="92" rx="40" ry="22" fill="${a.wing}"/><ellipse cx="112" cy="96" rx="24" ry="12" fill="${a.wing2||a.wing}"/>${a.flap?'</g>':''}</g>`;
  s+=`<circle cx="168" cy="60" r="34" fill="${a.head}"/>`;
  if(a.eyePatch)s+=`<circle cx="176" cy="56" r="14" fill="${a.eyePatch}"/>`;
  if(a.crest)s+=`<path d="M164,32 C158,10 146,3 138,3 C150,12 156,22 158,32 Z" fill="${a.crest}"/><path d="M172,31 C174,11 187,3 195,5 C184,13 178,22 178,31 Z" fill="${a.crest}"/>`;
  if(a.collar)s+=`<path d="M140,82 Q168,100 196,82 L196,90 Q168,108 140,90 Z" fill="${a.collar}" opacity=".9"/>`;
  if(a.beakType==='hook')s+=`<path d="M197,48 Q228,54 221,74 Q217,86 199,80 Q212,68 197,60 Z" fill="${a.beak}"/><path d="M200,80 L210,88 L200,88 Z" fill="${a.beak}"/>`;
  else s+=`<path d="M199,50 L224,61 L199,73 Q204,61 199,50 Z" fill="${a.beak}"/>`;
  if(a.cheek)s+=`<circle cx="187" cy="73" r="8" fill="${a.cheek}"/>`;
  if(a.brow){s+=`<circle cx="176" cy="56" r="7.5" fill="${a.eyeC||'#F2B33D'}"/><circle cx="178" cy="56" r="3.6" fill="#1D1A16"/><path d="M163,46 Q176,38 191,46 L191,52 Q176,45 163,52 Z" fill="${a.browC||'#3A2E1F'}"/>`;}
  else{s+=`<circle cx="176" cy="55" r="9" fill="#FFFDF6"/><circle cx="179" cy="55" r="4.6" fill="#241F1A"/><circle cx="181" cy="52.5" r="1.7" fill="#fff"/>`;}
  s+=`<path d="M110,144v19m-5.5,0h11M134,142v19m-5.5,0h11" stroke="${a.legs||'#C9A15C'}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  return s+'</svg>';
}
function owlBird(a){
  let s=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${a.alt||'بومة'}">`;
  s+=`<path d="M40,52 L26,10 L74,36 Z" fill="${a.body}"/><path d="M160,52 L174,10 L126,36 Z" fill="${a.body}"/>`;
  s+=`<ellipse cx="100" cy="112" rx="66" ry="78" fill="${a.body}"/>`;
  s+=`<ellipse cx="46" cy="120" rx="18" ry="44" fill="${a.wing}"/><ellipse cx="154" cy="120" rx="18" ry="44" fill="${a.wing}"/>`;
  s+=`<circle cx="70" cy="84" r="33" fill="${a.face}"/><circle cx="130" cy="84" r="33" fill="${a.face}"/><circle cx="100" cy="98" r="24" fill="${a.face}"/>`;
  s+=`<circle cx="72" cy="82" r="19" fill="#FFF8EA"/><circle cx="128" cy="82" r="19" fill="#FFF8EA"/>`;
  s+=`<circle cx="73" cy="83" r="10" fill="#221B12"/><circle cx="127" cy="83" r="10" fill="#221B12"/>`;
  s+=`<circle cx="77" cy="79" r="3" fill="#fff"/><circle cx="131" cy="79" r="3" fill="#fff"/>`;
  s+=`<path d="M52,64 Q72,55 90,64" stroke="${a.wing}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M110,64 Q128,55 148,64" stroke="${a.wing}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M90,102 L110,102 L100,122 Z" fill="${a.beak}"/>`;
  s+=`<g fill="${a.wing}" opacity=".5"><circle cx="86" cy="140" r="3"/><circle cx="106" cy="146" r="3"/><circle cx="116" cy="136" r="3"/><circle cx="94" cy="158" r="3"/><circle cx="112" cy="158" r="3"/></g>`;
  s+=`<path d="M84,182v7m-6,0h12M116,182v7m-6,0h12" stroke="${a.legs||'#C9A15C'}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return s+'</svg>';
}
function art(b,flap){return b.art.kind==='owl'?owlBird(b.art):sideBird({...b.art,flap});}

function assess(b,ageIdx,eats){
  if(b.age.stages){
    const st=b.age.stages[ageIdx]||b.age.stages[0];
    let text=st.text;
    if(eats==='no'&&ageIdx>0)text+=' وتذكّر: أي إطعام يدوي للجوارح عملية دقيقة خطرة — لا تحاول دون مختص.';
    if(eats==='yes'&&ageIdx===0)text+=' وإذن ربما يكون متقدمًا على عمره الظاهري — راقبه مع مختص.';
    return {title:st.title,text,tone:'warn'};
  }
  const m=b.age.mids[ageIdx];
  let r={};
  if(m<b.age.min)r={title:'غالبًا ما يزال فرخًا',text:b.age.chickNote,tone:'warn'};
  else if(m<=b.age.max)r={title:'قد يكون في مرحلة الفطام',text:b.age.weanNote,tone:'info'};
  else r={title:'غالبًا مفطوم',text:b.age.weanedNote,tone:'good'};
  if(r.tone!=='warn'&&eats==='no')return {title:'لم يفطم فعليًا بعد',text:'العمر وحده لا يكفي: الطائر الذي لا يأكل من الصحن بنفسه لم يفطم فعليًا حتى لو تجاوز العمر المعتاد — قد يحتاج إطعامًا يدويًا بطريقة خاصة. راجع طبيبًا بيطريًا مختصًا بالطيور قبل إطعامه بنفسك.',tone:'warn'};
  if(r.tone==='warn'&&eats==='yes')r.text+=' ويبدو أن طائرك متقدم على أقرانه — تأكد فقط أن وزنه يزداد باستمرار.';
  if(r.tone==='info'&&eats==='yes')r.text+=' وبما أنه يأكل بنفسه، فأنت على أطراف الفطام — قلّل الإطعام اليدوي تدريجيًا.';
  return r;
}

  if(r.view==='home')html=viewHome();
  else if(r.view==='cat'&&getCat(r.a))html=viewCat(r.a);
  else if(r.view==='bird'&&getBird(r.a))html=viewBird(r.a);
  else if(r.view==='train')html=viewTrain(r.b);

  app.innerHTML=html;
  window.scrollTo(0,0);
  markNav(r);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===(r.view==='train'?'train':r.a||'home')));
}

    <div class="backrow anim"><button class="backbtn" data-go="#/cat/${b.cat}">${icon('back',16)} عودة إلى ${CAT_NAME[b.cat]}</button></div>
    <div class="bird-hero anim" style="--b:${b.colors.bg};--a:${b.colors.a};animation-delay:.06s">
      <div class="deco">${art(b)}</div>
      <div class="info">
        <span class="cat-chip">${icon(b.cat==='raptors'?'warn':'heart',14)} ${CAT_NAME[b.cat]}</span>
        <h1>${b.name}</h1>
        <p class="desc">${b.desc}</p>
        <button class="mybtn ${isMy?'on':''}" data-star="${b.id}">${icon('star',16)} ${isMy?'طائري المحفوظ':'هذا طائري — احفظه'}</button>
      </div>
      <div class="arts">${art(b)}</div>
    </div>
    <div id="quizBox" class="anim" style="animation-delay:.12s">${quizHTML(b)}</div>
    <div class="tabs anim" style="animation-delay:.16s" id="tabsRow">
      ${(b.cat==='raptors'?TABS_RAP:TABS_PETS).map(t=>`<button class="tab ${state.uiTab[id]===t[0]?'on':''}" data-tab="${t[0]}">${icon(t[2],16)} ${t[1]}</button>`).join('')}

}

function quizHTML(b){
  const opts=b.age.stages?b.age.stages.map(s=>s.label):AGE_LABELS;
  const r=state.ui.age!=null?assess(b,state.ui.age,state.ui.eats):null;
  return `<div class="quiz">
    <h2>${icon('scale',22)} كم عمر طيرك؟</h2>
    <p class="hint">حدّد عمره وحالته، وسنقيّم مرحلته ونوجّهك لما يناسبها.</p>
    <div class="qrow"><label>العمر التقريبي</label>
      <div class="chips">${opts.map((o,i)=>`<button class="chip ${state.ui.age===i?'sel':''}" data-age="${i}">${o}</button>`).join('')}</div></div>
    <div class="qrow"><label>هل يأكل من الصحن بنفسه؟</label>
      <div class="chips">${[['yes','نعم يأكل بنفسه'],['no','لا، لا يأكل بنفسه'],['unsure','لم ألاحظ بعد']].map(x=>`<button class="chip ${state.ui.eats===x[0]?'sel':''}" data-eats="${x[0]}">${x[1]}</button>`).join('')}</div></div>
    <div id="quizOut">${r?`<div class="qout ${r.tone}"><b>${r.title}</b><br>${r.text}</div>
      <div class="vet-note">${icon('shield',18)}<span>تحديد الفطام لا يعتمد على العمر وحده، بل أيضًا على سلوك الطائر وقدرته على تناول الطعام بنفسه — عند الشك، استشر طبيبًا بيطريًا مختصًا بالطيور.</span></div>`:''}</div>
  </div>`;
}

function refreshQuiz(){
  const b=getBird(state.ui.birdId);
  const box=$('#quizBox');if(!box)return;
  box.innerHTML=quizHTML(b);
}

function tabHTML(b){
  const t=state.uiTab[b.id];
  if(b.cat==='pets')return tabPets(b,t);
  return tabRaptor(b,t);
}

function pts(list,ic='check',bad=false){return `<ul class="pts">${list.map(p=>{
  if(Array.isArray(p))return `<li class="${bad?'bad':''}">${icon(bad?'warn':ic,17)}<div><b class="t">${p[0]}</b><span class="d">${p[1]}</span></div></li>`;
  return `<li class="${bad?'bad':''}">${icon(bad?'warn':ic,17)}<div>${p}</div></li>`;
}).join('')}</ul>`}

function tabPets(b,t){
  if(t==='age')return `
    <h3 class="sect">${icon('scale',19)} مراحل العمر عند ${b.name}</h3>
    <p class="lead">أجب على السؤالين أعلاه (العمر + الأكل بنفسه) لتظهر لك تقدير مرحلة طائرك مباشرة.</p>
    <div style="margin-top:8px">
      <div class="stagerow"><span class="st" style="background:var(--amber)">فرخ</span><p>${b.age.chickNote}</p></div>
      <div class="stagerow"><span class="st" style="background:#D98A2B">فطام</span><p>${b.age.weanNote}</p></div>
      <div class="stagerow"><span class="st" style="background:#5FA36B">مفطوم</span><p>${b.age.weanedNote}</p></div>
    </div>
    <div class="two">
      <div class="sign-col chick"><h4>${icon('spark',17)} علامات أنه ما زال فرخًا</h4><ul>${CHICK_SIGNS.map(s=>`<li>${icon('warn',14)}<span>${s}</span></li>`).join('')}</ul></div>
      <div class="sign-col weaned"><h4>${icon('check',17)} علامات الطائر المفطوم</h4><ul>${WEANED_SIGNS.map(s=>`<li>${icon('check',14)}<span>${s}</span></li>`).join('')}</ul></div>
    </div>
    <div class="vet-note">${icon('shield',18)}<span>هذه العلامات إرشادية — تحديد الفطام الحقيقي يعتمد على سلوك طائرك وقدرته على الأكل بنفسه، وعند الشك استشر طبيبًا بيطريًا مختصًا بالطيور.</span></div>`;
  if(t==='feeding')return `
    <h3 class="sect">${icon('food',19)} التغذية</h3><p class="lead">${b.feeding.intro}</p>
    ${pts(b.feeding.good)}<h3 class="sect" style="color:var(--red)">${icon('warn',19)} تجنّب تمامًا</h3>${pts(b.feeding.avoid,'warn',true)}
    <h3 class="sect">${icon('pulse',19)} الماء</h3><ul class="pts"><li>${icon('pulse',17)}<div>${b.feeding.water}</div></li></ul>`;
  if(t==='housing')return `
    <h3 class="sect">${icon('home',19)} السكن والقفص</h3><p class="lead">${b.housing.intro}</p>${pts(b.housing.points,'home')}`;
  if(t==='taming')return tamingHTML(b);

  if(t==='training')return trainingHTML(b);
  if(t==='health')return `<h3 class="sect">${icon('shield',19)} الرعاية الصحية</h3><p class="lead">${b.health.intro}</p>${pts(b.health.points,'shield')}
    <div class="vet-note">${icon('shield',18)}<span>أي تغيّر مفاجئ في الأكل أو الوزن أو النشاط يستحق زيارة طبيب بيطري مختص بالطيور — لا انتظار.</span></div>`;
  if(t==='warnings')return `<div class="warnbox"><h4>${icon('warn',19)} تنبيهات خاصة بـ${b.name}</h4><ul>${b.warnings.map(w=>`<li>${icon('warn',15)}<span>${w}</span></li>`).join('')}</ul></div>`;
  return '';

function tamingHTML(b){
  const done=store('dlt-taming')||{};const arr=done[b.id]||[];
  const n=arr.filter(Boolean).length,pct=Math.round(n/b.taming.steps.length*100);
  return `<h3 class="sect">${icon('hand',19)} تعويد ${b.name} على اليد</h3><p class="lead">${b.taming.intro} — انقر على كل خطوة بعد إنجازها لتتبع تقدمك.</p>
  <div class="prog"><div class="bar"><div class="fill" style="width:${pct}%"></div></div>
  <div class="lbl"><span>${n} من ${b.taming.steps.length} خطوات</span><span>${pct===100?'مكتمل — أحسنت!':pct+'%'}</span></div></div>
  <ol class="steps-list">${b.taming.steps.map((s,i)=>`<li class="${arr[i]?'done':''}" data-step="${i}"><span class="stx">${s}</span></li>`).join('')}</ol>
  <button class="reset-steps" data-reset-steps="${b.id}">${icon('refresh',14)} إعادة ضبط التقدم</button>`;
}

function toggleStep(i){
  const id=state.ui.birdId,b=getBird(id);
  const all=store('dlt-taming')||{};const arr=all[id]||[];
  arr[i]=!arr[i];all[id]=arr;store('dlt-taming',all);
  if(arr.filter(Boolean).length===b.taming.steps.length)toast('أحسنت! أكملت كل خطوات التعوّد مع '+b.name,'star');
  $('#tabBody').innerHTML=tabHTML(b);
}

function trainingHTML(b){
  const isRap=b.cat==='raptors';
  return `<h3 class="sect">${icon('award',19)} تدريب ${b.name}</h3><p class="lead">${b.training.intro}</p>
  ${isRap?`<div class="raptor-banner" style="margin-top:14px">${icon('warn',22)}<div><b>للجوارح:</b> هذه معلومات عامة فقط. أي تدريب عملي يتطلب مدربًا أو صقّارًا مرخصًا ومعدات احترافية — لا تجرّب بنفسك.</div></div>`:''}
  <ol class="timeline">${b.training.items.map((it,i)=>`<li><span class="num">${i+1}</span><b>${it[0]}</b><span>${it[1]}</span></li>`).join('')}</ol>
  <div class="switcher"><span style="font-weight:700;font-size:.88rem;color:var(--muted);align-self:center">خطة نوع آخر:</span>${DB.filter(x=>x.id!==b.id).map(x=>`<button class="chip" data-go="#/train/${x.id}">${x.name}</button>`).join('')}</div>`;
}

function tabRaptor(b,t){
  if(t==='identify')return `<h3 class="sect">${icon('search',19)} التعرف على نوع ${b.name}</h3><p class="lead">${b.identify.intro}</p>${pts(b.identify.points,'search')}`;
  if(t==='age')return `<h3 class="sect">${icon('scale',19)} العمر التقريبي</h3><p class="lead">اختر مرحلة طائرك من الأسئلة أعلى الصفحة لتظهر التوجيهات المناسبة.</p>
    ${b.age.stages.map(s=>`<div class="stagerow"><span class="st" style="background:var(--amber)">${s.title}</span><p>${s.text}</p></div>`).join('')}
    <div class="vet-note">${icon('shield',18)}<span>عند الشك في العمر أو الحالة — خاصة مع الجوارح — استشر مختص حياة برية أو بيطريًا متخصصًا فورًا.</span></div>`;
  if(t==='feeding')return `<h3 class="sect">${icon('food',19)} الغذاء المناسب</h3><p class="lead">${b.feeding.intro}</p>${pts(b.feeding.good)}
    <h3 class="sect" style="color:var(--red)">${icon('warn',19)} خطر وممنوع</h3>${pts(b.feeding.avoid,'warn',true)}
    <h3 class="sect">${icon('pulse',19)} الماء</h3><ul class="pts"><li>${icon('pulse',17)}<div>${b.feeding.water}</div></li></ul>`;
  if(t==='housing')return `<h3 class="sect">${icon('home',19)} البيئة المناسبة</h3><p class="lead">${b.housing.intro}</p>${pts(b.housing.points,'home')}`;
  if(t==='behavior')return `<h3 class="sect">${icon('eye',19)} علامات الخوف والتوتر</h3><p class="lead">${b.behavior.intro}</p>
    ${b.behavior.signals.map(s=>`<div class="sig ${s[2]}"><div class="ic-w">${icon(s[2]==='warn'?'warn':s[2]==='good'?'heart':'eye',20)}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}`;
  if(t==='handling')return `<h3 class="sect">${icon('hand',19)} التعامل الآمن</h3>${pts(b.handling,'hand')}`;
  if(t==='health')return `<h3 class="sect">${icon('shield',19)} الرعاية الصحية</h3><p class="lead">${b.health.intro}</p>${pts(b.health.points,'shield')}`;
  if(t==='specialist')return `<h3 class="sect">${icon('chat',19)} متى يجب التواصل مع مختص؟</h3>
    <div class="warnbox" style="margin-top:12px"><h4>${icon('warn',18)} تواصل فورًا عند أي مما يلي</h4><ul>${b.specialist.map(s=>`<li>${icon('warn',15)}<span>${s}</span></li>`).join('')}</ul></div>`;
  if(t==='warnings')return `<div class="warnbox"><h4>${icon('warn',19)} تحذيرات وقانون — ${b.name}</h4><ul>${b.warnings.map(w=>`<li>${icon('warn',15)}<span>${w}</span></li>`).join('')}</ul>
    <p style="margin-top:12px;font-size:.88rem">${b.legal}</p></div>`;
  return '';
}

function viewTrain(id){
  const b=(id&&getBird(id))||getBird(store('dlt-last'));
  if(!b)return `<section class="wrap sec anim"><h1 style="color:var(--green);font-size:2rem">تدريب طيرك</h1>
    <p class="lead" style="margin-top:6px">اختر طائرًا لعرض خطة تدريبه المخصصة — كل نوع له مسار مختلف تمامًا.</p>
    <div class="grid stagger" style="padding-top:26px">${DB.map(birdCard).join('')}</div></section>`;
  const isRap=b.cat==='raptors';

    <p class="lead" style="margin-top:4px">${isRap?'الجوارح تُدرَّب عمليًا داخل إطار مرخص — هذه معلومات توعوية حول مسارها.':'خطة تدريب مخصصة تناسب طبيعة '+b.name+' — تدرّج بالخطوات ولا تستعجل.'}</p>

    <div style="margin-top:14px"><button class="btn ghost" data-go="#/bird/${b.id}">${icon('feather',17)} افتح الصفحة الكاملة لـ${b.name}</button></div>

const sOv=$('#searchOv');
function openSearch(){sOv.classList.add('open');$('#gSearch').value='';renderSearch('');setTimeout(()=>$('#gSearch').focus(),50)}
function closeSearch(){sOv.classList.remove('open')}
function renderSearch(q){
  q=q.trim();
  const res=q?DB.filter(b=>b.name.includes(q)||b.desc.includes(q)):DB;
  $('#searchRes').innerHTML=res.length?res.map(b=>`<button class="sres" data-go="#/bird/${b.id}">${art(b)}<div><b>${b.name}</b><small>${b.desc.slice(0,60)}…</small></div><span class="cat-tag ${b.cat==='raptors'?'r':''}">${CAT_NAME[b.cat]}</span></button>`).join('')
    :`<div class="snone">${icon('search',26)}<br>لا نتائج لـ«${q}» — جرّب اسمًا آخر مثل «كوكتيل» أو «صقر»</div>`;
}
 $('#gSearch').addEventListener('input',e=>renderSearch(e.target.value));
sOv.addEventListener('click',e=>{if(e.target===sOv)closeSearch()});

const AS={data:{},started:false};
const aMsgs=$('#asstMsgs'),aChips=$('#asstChips');
 $('#fab').innerHTML=art(getBird('cockatiel'))+'<span class="dot"></span>';
 $('#asstAv').innerHTML=art(getBird('cockatiel'));
document.querySelector('[data-asst-reset]').innerHTML=icon('refresh',17);
document.querySelector('[data-asst-close]').innerHTML=icon('close',17);
document.querySelector('.asst-form button').innerHTML=icon('send',18);

function scrollAsst(){aMsgs.scrollTop=aMsgs.scrollHeight}
function botSay(html){aMsgs.insertAdjacentHTML('beforeend',`<div class="msg bot">${html}</div>`);scrollAsst()}
function userSay(t){aMsgs.insertAdjacentHTML('beforeend',`<div class="msg me">${t}</div>`);scrollAsst()}
function botTyping(cb,delay=700){
  aMsgs.insertAdjacentHTML('beforeend','<div class="msg bot typing" id="tp"><span></span><span></span><span></span></div>');scrollAsst();
  setTimeout(()=>{$('#tp')?.remove();cb()},delay);
}
function openAsst(){
  $('#asst').classList.add('open');
  if(!AS.started){AS.started=true;const my=getBird(MY()[0]);
    botSay(my?`أهلًا! سمعت أن عندك <b>${my.name}</b> — أخبرني عنه وأعطيك إرشادات تناسبه.`:`أهلًا! أنا <b>مساعد دلع طيرك</b> — اكتب عن طائرك مثل: <i>«عندي كوكتيل عمره 4 شهور ومش خايف»</i>، أو أجب على أسئلتي خطوة بخطوة.`);
    botTyping(askNext,900);
  }
}
function closeAsst(){$('#asst').classList.remove('open')}
function resetAsst(){AS.data={};aMsgs.innerHTML='';aChips.innerHTML='';botSay('نبدأ من جديد — حدثني عن طائرك أو أجب على أسئلتي.');botTyping(askNext,800)}

function chips(list,key){aChips.innerHTML=list.map((c,i)=>`<button class="chip" data-key="${key}" data-i="${i}">${c}</button>`).join('')}
function askNext(){
  const d=AS.data;
  if(!d.bird){botSay('أولًا: <b>ما نوع طائرك؟</b>');chips(DB.map(b=>b.name),'bird');return}
  const b=getBird(d.bird);
  if(d.age==null){botSay(`جميل! <b>${b.name}</b> — <b>كم عمره تقريبًا؟</b>`);chips(b.age.stages?b.age.stages.map(s=>s.label):AGE_LABELS,'age');return}
  if(d.eats==null){botSay('<b>هل يأكل من الصحن بنفسه؟</b> هذه أهم علامة فطام.');chips(['نعم يأكل بنفسه','لا، لا يأكل بنفسه','لم ألاحظ بعد'],'eats');return}
  if(d.fear==null){botSay('<b>هل يخاف من اليد؟</b> يبتعد ويرتعب عندما تقرّب يدك؟');chips(['نعم يخاف من اليد','لا، ليس خائفًا','لست متأكدًا'],'fear');return}
  if(d.since==null){botSay('<b>منذ متى هو عندك؟</b>');chips(['منذ يوم أو يومين','منذ أسبوع تقريبًا','منذ أكثر من شهر','منذ فترة طويلة'],'since');return}
  showResult();
}
const CLOSES=['تذكّر دائمًا: اختلاف الطيور طبيعي تمامًا — لكل طائر شخصيته، والتدريب يكون خطوة صغيرة كل يوم.','واختلاف الطيور طبيعي جدًا — ما ينجح مع طائر قد يحتاج وقتًا أطول مع آخر، والتدرّج هو السر دائمًا.','وأخيرًا: كل طائر شخصية مستقلة — قارن تقدمه بنفسه بالأمس لا بغيره، وسيصل بإذن الله.'];
function showResult(){
  aChips.innerHTML='';
  const d=AS.data,b=getBird(d.bird);
  const a=assess(b,d.age,d.eats);
  let html=`<b>${b.name}</b> — النتيجة:<br><b>${a.title}</b><br>${a.text}`;
  if(b.cat==='raptors'){
    html+='<br><br>وياخذ الجوارح بعين مختلفة تمامًا: أي تدريب أو تعويد عملي يتم مع صقّار أو مختص مرخص حصرًا — دورك هنا هو الرعاية الآمنة والمراقبة.';
  }else{
    if(d.eats==='unsure')html+='<br><br>لحظة الأكل تكشف كل شيء: ضع الطعام في صحن واسحب يدك بهدوء وراقب — أسرع طريقة لمعرفة مرحلته الحقيقية.';
    if(d.fear===true)html+=`<br><br>خوف اليد طبيعي وشائع: ابدأ بخطوة «${b.taming.steps[0]}» ثم تدرّج بالخطوات الباقية — ولا تجبره أبدًا على النزول ليدك.`;
    else if(d.fear===false)html+='<br><br>أنت في وضع ممتاز! طائرك لا يخاف منك — ابدأ تعويد اليد تدريجيًا: مكافأة من طرف القفص، ثم يد ثابتة تحت الصدر. التدرّج هو السر.';
    else html+='<br><br>راقب أولاً: إن يبتعد عند اقتراب يدك ويرتفع ريشه فهو خائف مؤقتًا — تعامل معه كخائف حتى تتأكد.';
    const S=['منذ يوم أو يومين؟ أعطه 3–5 أيام هدوء للتأقلم قبل أي تدريب — الانطباع الأول يبقى عنده طويلًا.','منذ أسبوع؟ وقت مثالي لبدء الجلوس القريب والكلام الهادئ، ثم الانتقال للمكافآت.','منذ أكثر من شهر؟ أنهيت مرحلة التأقلم — وسّع التدريب خطوة جديدة كل أسبوع.','علاقة قديمة بينكما — حافظ على الروتين ووسّع تحديات التدريب ببطء وثبات.'];
    if(d.since!=null)html+='<br><br>'+S[d.since];
    html+='<br><br>'+CLOSES[Math.floor(Math.random()*CLOSES.length)];
  }
  html+=`<br><button class="btn" data-go="#/bird/${b.id}">${icon('feather',15)} صفحة ${b.name} الكاملة</button><button class="btn ghost" data-asst-reset>${icon('refresh',15)} من جديد</button>`;
  botTyping(()=>botSay(html),1100);
}

/* المحلل النصي الحر */
function parseText(t){
  const d={};
  const KW=[['cockatiel',['كوكتيل','كوكاتيل','كوكتييل']],['budgie',['بادجي','بودجي','بادج','باديج']],['parrot',['ببغاء','الافريقي','الافريقى','الرمادي']],['lovebird',['حب','الحب']],['canary',['كناري','الكنار']],['pigeon',['حمام','يمام','زغلول']],['finch',['عصفور','عصافير','فينش','زيبرا']],['owl',['بومة','القرنة','قرنة']],['falcon',['صقر','شاهين','حر صقر']],['eagle',['عقاب','نسر']]];
  for(const[id,ws]of KW)if(ws.some(w=>t.includes(w))){d.bird=id;break}
  const m=t.match(/(\d+)\s*(يوم|أيام|أسبوع|اسبوع|أسابيع|اسابيع|شهر|شهور|أشهر|اشهر|سنة|سنوات|عام)/);
  if(m){let v=+m[1];const u=m[2];
    if(/يوم/.test(u))v/=30;else if(/أسبوع|اسبوع|أسابيع|اسابيع/.test(u))v/=4.3;else if(/سنة|سنوات|عام/.test(u))v*=12;
    d.age=v;}
  if(/فرخ|بيضة/.test(t))d.age=0.5;
  if(/مفطوم|فطام/.test(t)){d.eats='yes';d.age=Math.max(d.age||0,12)}
  if(/مش خايف|مو خايف|ما يخاف|لا يخاف|مش يخاف|مرتاح مني|مرتاح منى/.test(t))d.fear=false;
  else if(/خايف|يخاف|خوف|هرب مني|هرب منى/.test(t))d.fear=true;
  if(/ياكل بنفس|يأكل بنفس|ياكل لوحد|يأكل وحده|ياكل وحده/.test(t))d.eats='yes';
  else if(/لا يأكل|ما يأكل|ما ياكل|مش يأكل|مش ياكل/.test(t))d.eats='no';
  if(/منذ|من (يوم|أسبوع|اسبوع|شهر)/.test(t)){if(/يوم/.test(t))d.since=0;else if(/أسبوع|اسبوع/.test(t))d.since=1;else if(/شهر/.test(t))d.since=2;else d.since=3}
  return d;
}

function toAgeIdx(b,months){
  if(b.age.stages){if(months<2)return 0;if(months<8)return 1;return 2}
  const m=b.age.mids;let idx=0;
  for(let i=0;i<m.length;i++)if(months>=m[i]-(i?m[i]-m[i-1]:0)/2)idx=i;
  return idx;
}

  if(t.closest('[data-search-open]')){openSearch();return}

    const body=$('#tabBody');body.innerHTML=tabHTML(getBird(state.ui.birdId));body.style.animation='none';body.offsetHeight;body.style.animation='';return}

  const star=t.closest('[data-star]');if(star){

    store('dlt-my',my);render();return}
  if(t.closest('[data-back]')){history.length>1?history.back():go('#/')}
});
